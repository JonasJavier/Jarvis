# Manifest de proyecto. Un archivo por proyecto de cliente.
# Fuente de verdad versionada (ADR-017): se carga con `manage.py load_manifests` y se valida con un
# esquema estricto. Ningún valor puede superar los techos de global.yaml. Sin secretos.
version: 1

project:
  id: example
  client_id: example-client
  name: Example Project
  repository: jonasjavier/jarvis-sandbox
  default_branch: main

environments:
  staging:
    auto_deploy: true               # lo ejecuta StagingTrigger/CI tras CI en verde, nunca el coding worker
  production:
    # deploy, rollback, restart, migraciones: vía ProductionTools según autonomy_level
    rollback_on_failed_health_check: true
    backup_before_risky_operations: true

contract:
  maintenance_included:
    - bug_fix
    - minor_update
    - monitoring
    - backups
    - non_breaking_dependency_update
  maintenance_excluded:
    - new_feature
    - redesign
    - new_external_provider
    - large_migration
  sla:
    critical_first_response_minutes: 30
    normal_first_response_minutes: 240

maintenance:
  enabled: true
  schedule: "0 3 1 * *"             # mecanismo de cron de producción: pendiente (Fase 4)
  tasks:
    - run_tests
    - dependency_check
    - security_scan
    - endpoint_health
    - error_review
    - backup_verification
    - monthly_report

commands:                           # se ejecutan como código no confiable, sin credenciales
  install: ["uv sync"]
  test: ["uv run pytest -q"]
  lint: ["uv run ruff check ."]
  typecheck: []

ownership: client                   # client | internal (nivel 4 solo para internal)

policy:
  # Nivel de autonomía (0–4). La clase de riesgo de cada acción está fijada en código
  # (permissions-and-approvals.md). Nivel 2: autónomo en staging y mensajes de bajo riesgo;
  # deploy a producción y aviso de resolución al cliente requieren aprobación.
  autonomy_level: 2
  # Endurecimientos opcionales: estas acciones requieren aprobación aunque el nivel las cubra.
  restrict: []
  # Las acciones críticas y las prohibiciones vienen de código y de global.yaml; no se pueden relajar.

budget:                             # no puede superar cliente ni global
  max_ai_usd_per_run: 3.00
  daily_usd: 5.00
  monthly_usd: 40.00

agent:                              # dentro de worker_limits.ceiling de global.yaml
  max_turns: 12
  timeout_seconds: 2400
  max_retries: 1

communications:
  language: es
  tone: "breve, humano y sencillo"
  # Cada tipo de mensaje tiene clase de riesgo en código: acuse/info/estado = low,
  # aviso de resolución = medium, precios/plazos/contratos/compensaciones = critical.
  escalation_keywords:
    - "hablar con jonas"
    - "necesito una persona"
    - "urgente"
