# Manifest de proyecto. Un archivo por proyecto de cliente.
# Fuente de verdad versionada (ADR-017): se carga con `manage.py load_manifests` y se valida con un
# esquema estricto. Ningún valor puede superar los techos de global.yaml. Sin secretos.
version: 1

project:
  id: example
  client_id: example-client
  name: Example Project
  repository: my-org/example
  default_branch: main

environments:
  staging:
    auto_deploy: true               # lo ejecuta StagingTrigger/CI tras CI en verde, nunca el coding worker
  production:
    auto_deploy: false
    requires_approval: true

contract:
  maintenance_included:
    - bug_fix
    - minor_update
    - monitoring
    - backups
    - non_breaking_dependency_update
  maintenance_excluded:
    - new_feature
    - redesign
    - new_external_provider
    - large_migration
  sla:
    critical_first_response_minutes: 30
    normal_first_response_minutes: 240

maintenance:
  enabled: true
  schedule: "0 3 1 * *"             # mecanismo de cron de producción: pendiente (Fase 4)
  tasks:
    - run_tests
    - dependency_check
    - security_scan
    - endpoint_health
    - error_review
    - backup_verification
    - monthly_report

commands:                           # se ejecutan como código no confiable, sin credenciales
  install: ["uv sync"]
  test: ["pytest"]
  lint: ["ruff check ."]
  typecheck: ["mypy ."]

policy:                             # acción no listada => forbidden. El techo por actor (código) prevalece.
  autonomous:
    - read_repository
    - read_sanitized_logs
    - run_tests
    - run_linter
    - modify_worktree
    - commit
    - create_branch
    - create_draft_pr
    - deploy_staging                # actor: staging_trigger / ci
    - draft_client_reply
  requires_approval:
    - merge_default_branch
    - deploy_production             # actor: deployer, con Approval ligado a action_digest
    - database_migration
    - change_iam
    - rotate_credentials
    - destructive_database_operation
    - financial_operation
    - quote_new_feature
  # forbidden: heredado de global.yaml; se pueden añadir prohibiciones, no quitarlas

budget:                             # no puede superar cliente ni global
  max_ai_usd_per_run: 3.00
  daily_usd: 5.00
  monthly_usd: 40.00

agent:                              # dentro de worker_limits.ceiling de global.yaml
  max_turns: 12
  timeout_seconds: 2400
  max_retries: 1

communications:
  auto_reply:
    allowed:
      - acknowledgement
      - request_for_debug_information
      - status_update
    approval_required:
      - pricing
      - deadlines
      - contract_changes
      - compensation
  escalation_keywords:
    - "hablar con jonas"
    - "necesito una persona"
    - "urgente"
