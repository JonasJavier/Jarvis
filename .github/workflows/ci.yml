name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: jarvis
          POSTGRES_USER: jarvis
          POSTGRES_PASSWORD: jarvis
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jarvis -d jarvis"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20

    env:
      DATABASE_URL: postgres://jarvis:jarvis@localhost:5432/jarvis

    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Format
        run: uv run ruff format --check .

      - name: Type check
        run: uv run mypy apps/api workers tests

      - name: Migrations are up to date
        working-directory: apps/api
        run: uv run python manage.py makemigrations --check --dry-run --settings=config.settings.test

      - name: Manifests are valid
        working-directory: apps/api
        run: uv run python manage.py load_manifests --validate-only --settings=config.settings.test

      - name: Build control-plane image
        run: docker build -t jarvis-api:ci .

      - name: Build worker sandbox image
        run: docker build -f workers/coder/Dockerfile -t jarvis-worker:dev .

      - name: Tests
        run: uv run pytest --cov --cov-report=term-missing:skip-covered
