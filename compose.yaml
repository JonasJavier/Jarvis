# Local development only. Production (Railway) is defined in Phase 4 from the owner's guide.
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: jarvis
      POSTGRES_USER: jarvis
      POSTGRES_PASSWORD: jarvis
    ports:
      - "55432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jarvis -d jarvis"]
      interval: 2s
      timeout: 3s
      retries: 20

  api:
    build: .
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      DATABASE_URL: postgres://jarvis:jarvis@db:5432/jarvis
      JARVIS_MANIFESTS_DIR: /app/project_manifests
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py load_manifests &&
             python manage.py runserver 0.0.0.0:8000"
    ports:
      - "8000:8000"
    volumes:
      - ./apps/api:/app/apps/api
      - ./project_manifests:/app/project_manifests:ro
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
